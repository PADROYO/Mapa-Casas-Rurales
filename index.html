<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Comparador de casas rurales</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="">

<link rel="stylesheet" href="css/styles.css">
</head>

<body>

<div class="app">


<aside class="sidebar">

    <div class="header">

        <div class="eyebrow">
            Planifica tu escapada
        </div>

        <h1>
            Casas rurales · Comparador
        </h1>

        <div class="sub" id="subtitle">
            Alojamientos por el País Vasco y alrededores
        </div>

    </div>


    <div class="filters">

        <select id="sort" aria-label="Ordenar por">

            <option value="recommended">
                Orden recomendado
            </option>

            <option value="priceAsc">
                Precio: menor a mayor
            </option>

            <option value="priceDesc">
                Precio: mayor a menor
            </option>

        </select>


        <select id="people" aria-label="Número de personas">

            <option value="0">
                Cualquier grupo
            </option>

            <option value="8">
                8+ personas
            </option>

            <option value="10">
                10+ personas
            </option>

            <option value="12">
                12+ personas
            </option>

        </select>

    </div>


    <div class="search-wrap">

        <input
            class="search"
            id="search"
            placeholder="Buscar por nombre o zona…"
            aria-label="Buscar alojamiento">

    </div>


    <div class="results">

        <div
            class="result-count"
            id="count">
        </div>

        <div id="list"></div>

    </div>


    <div class="footer">

        Datos y precios orientativos · Comprueba las condiciones con cada alojamiento.

    </div>

</aside>


<main class="map-wrap">

    <div
        id="map"
        aria-label="Mapa de alojamientos">
    </div>


    <div class="map-note">

        📍 Pulsa un precio o alojamiento para ver detalles

    </div>

</main>


</div>

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin="">
</script>

<script src="js/casas.js"></script>

<script src="js/mapa.js"></script>

</body>
</html>
