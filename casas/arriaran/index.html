<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Casa Rural Astorki Goikoa</title>

    <link
        rel="stylesheet"
        href="../../css/styles.css"
    >

    <style>

        .house-page {
            min-height: 100vh;
            background: #f4f7fb;
        }

        .house-container {
            width: min(1100px, calc(100% - 30px));
            margin: 0 auto;
            padding: 25px 0 50px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 18px;
            color: #17263c;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
        }

        .house-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(16, 33, 58, .10);
        }

        .gallery {
            position: relative;
            width: 100%;
            height: 500px;
            background: #e5edf0;
            overflow: hidden;
        }

        .gallery img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .gallery-button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);

            width: 42px;
            height: 42px;

            border: 0;
            border-radius: 50%;

            background: rgba(255,255,255,.9);

            cursor: pointer;

            font-size: 22px;
            font-weight: bold;

            box-shadow: 0 3px 12px rgba(0,0,0,.18);
        }

        .gallery-button.prev {
            left: 15px;
        }

        .gallery-button.next {
            right: 15px;
        }

        .photo-counter {
            position: absolute;

            bottom: 15px;
            left: 50%;

            transform: translateX(-50%);

            background: rgba(0,0,0,.65);

            color: white;

            padding: 6px 11px;

            border-radius: 20px;

            font-size: 12px;
        }

        .house-content {
            padding: 30px;
        }

        .house-title {
            margin: 0 0 5px;

            font-size: 30px;
            line-height: 1.2;

            letter-spacing: -.04em;
        }

        .house-location {
            color: #68768a;

            font-size: 14px;

            margin-bottom: 20px;
        }

        .house-price {
            color: #e63946;

            font-size: 32px;

            font-weight: 850;

            margin-bottom: 20px;
        }

        .house-price span {
            color: #68768a;

            font-size: 13px;

            font-weight: 500;
        }

        .house-stats {
            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 10px;

            margin-bottom: 20px;
        }

        .house-stat {
            background: #f4f7fb;

            border-radius: 12px;

            padding: 14px;

            font-size: 13px;
        }

        .house-stat strong {
            display: block;

            margin-bottom: 4px;
        }

        .house-description {
            color: #46556a;

            font-size: 14px;

            line-height: 1.65;
        }

        .house-features {
            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            margin: 20px 0;
        }

        .house-feature {
            background: #f4f7fb;

            border-radius: 8px;

            padding: 7px 10px;

            font-size: 12px;

            color: #59677b;
        }

        .house-actions {
            display: flex;

            flex-wrap: wrap;

            gap: 10px;

            margin-top: 25px;
        }

        .house-button {
            display: inline-block;

            padding: 12px 18px;

            border-radius: 10px;

            text-decoration: none;

            font-size: 13px;

            font-weight: 800;

            border: 1px solid #e4e9f0;

            color: #17263c;

            background: white;
        }

        .house-button.primary {
            background: #e63946;

            border-color: #e63946;

            color: white;
        }

        @media (max-width: 700px) {

            .house-container {
                width: calc(100% - 20px);

                padding-top: 15px;
            }

            .gallery {
                height: 300px;
            }

            .house-content {
                padding: 20px;
            }

            .house-title {
                font-size: 23px;
            }

            .house-price {
                font-size: 27px;
            }

            .house-stats {
                grid-template-columns: 1fr 1fr;
            }

            .house-actions {
                flex-direction: column;
            }

            .house-button {
                text-align: center;

                width: 100%;
            }

        }

    </style>

</head>


<body>

<div class="house-page">

    <div class="house-container">

        <a
            class="back-link"
            href="../../index.html"
        >
            ← Volver al comparador
        </a>


        <article class="house-card">


            <!-- GALERÍA -->

            <div class="gallery">

                <img
                    id="gallery-image"
                    src="fotos/1.jpg"
                    alt="Casa Rural Arriaran"
                >

                <button
                    class="gallery-button prev"
                    onclick="previousPhoto()"
                    aria-label="Foto anterior"
                >
                    ‹
                </button>

                <button
                    class="gallery-button next"
                    onclick="nextPhoto()"
                    aria-label="Foto siguiente"
                >
                    ›
                </button>

                <div
                    class="photo-counter"
                    id="photo-counter"
                >
                    1 / 4
                </div>

            </div>


            <!-- INFORMACIÓN -->

            <div class="house-content">

                <h1 class="house-title">
                    Casa Rural Arriaran
                </h1>

                <div class="house-location">
                    📍 Gipuzkoa · interior
                </div>


                <div class="house-price">
                    800 €
                    <span>precio total orientativo</span>
                </div>


                <div class="house-stats">

                    <div class="house-stat">
                        <strong>👥 Capacidad</strong>
                        12 personas
                    </div>

                    <div class="house-stat">
                        <strong>🛏 Habitaciones</strong>
                        6 habitaciones
                    </div>

                </div>

                <div class="house-features">

                    <span class="house-feature">
                        Vistas
                    </span>

                    <span class="house-feature">
                        Jardín
                    </span>

                </div>

                <p class="house-description">
                    Alojamiento para grupos. Completa esta ficha con la información confirmada.
                </p>


                <div class="house-actions">

                    <a
                        class="house-button primary"
                        href="#"
                        target="_blank"
                        rel="noopener"
                    >
                        Ver anuncio / reservar ↗
                    </a>

                    <a
                        class="house-button"
                        href="https://www.google.com/maps/dir/?api=1&destination=43.125,-2.03"
                        target="_blank"
                        rel="noopener"
                    >
                        Cómo llegar ↗
                    </a>

                </div>

            </div>

        </article>

    </div>

</div>


<script>

    const photos = Array.from(
        { length: 23 },
        (_, i) => `fotos/${i + 1}.jpg`
    );

    let currentPhoto = 0;


    function showPhoto() {

        const image =
            document.getElementById("gallery-image");

        const counter =
            document.getElementById("photo-counter");


        image.src = photos[currentPhoto];

        counter.textContent =
            `${currentPhoto + 1} / ${photos.length}`;

    }


    function nextPhoto() {

        currentPhoto++;

        if (currentPhoto >= photos.length) {
            currentPhoto = 0;
        }

        showPhoto();

    }


    function previousPhoto() {

        currentPhoto--;

        if (currentPhoto < 0) {
            currentPhoto = photos.length - 1;
        }

        showPhoto();

    }

</script>

</body>

</html>
